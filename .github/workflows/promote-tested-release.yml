name: Promote tested ReleaseOnly artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build ReleaseOnly workflow run ID
        required: true
        type: string
      expected_installer_sha256:
        description: SHA-256 of the installer that completed runtime testing
        required: true
        type: string
      target_commit_sha:
        description: Exact source commit used by the successful build
        required: true
        type: string
      release_tag:
        description: GitHub Release tag
        required: true
        default: v34.0.0.376-release-only.1
        type: string
  push:
    branches:
      - master
    paths:
      - ".github/workflows/promote-tested-release.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-cleanflash-tested-release
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[promote-tested]')
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '30095591420' }}
      EXPECTED_INSTALLER_SHA256: ${{ inputs.expected_installer_sha256 || 'dae566c0f9618558d3bcc1bb600eaf1a93d9bd2a1c179cc0b74df6fb4ef309f4' }}
      TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha || '46dcde103ecd0c28f1b12890731469c0c1a0e238' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v34.0.0.376-release-only.1' }}
      RELEASE_TITLE: Clean Flash 34.0.0.376 ReleaseOnly
      RELEASE_NOTES: release-notes/v34.0.0.376-release-only.1.md
      ARTIFACT_NAME: CleanFlash-34.0.0.376-ReleaseOnly
      INSTALLER_NAME: CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release documentation
        uses: actions/checkout@v4

      - name: Download the tested Actions artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist

      - name: Verify the tested installer
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' "$EXPECTED_INSTALLER_SHA256" "$INSTALLER_NAME" |
            sha256sum --check -
          sha256sum --check SHA256SUMS.txt

      - name: Create a draft Release with the tested files
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            --draft \
            "dist/$INSTALLER_NAME" \
            "dist/SHA256SUMS.txt"

      - name: Download the draft assets and verify them again
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-verification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-verification
          cd release-verification
          printf '%s  %s\n' "$EXPECTED_INSTALLER_SHA256" "$INSTALLER_NAME" |
            sha256sum --check -
          sha256sum --check SHA256SUMS.txt

      - name: Publish the verified Release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

name: Publish two installer packages

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-two-packages.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'release: publish two installer packages'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v34.0.0.376-release-only.1
      LEGACY: CleanFlash_34.0.0.376_LegacyBundle_56.6MiB.exe
      RELEASE_ONLY: CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe
    steps:
      - name: Reconstruct and verify the legacy package
        shell: bash
        run: |
          set -euo pipefail
          : > "$LEGACY"
          while IFS= read -r blob; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content |
              tr -d '\n' |
              base64 --decode >> "$LEGACY"
          done <<'BLOB_SHAS'

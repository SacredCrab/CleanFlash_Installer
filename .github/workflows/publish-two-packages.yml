          test "$(stat -c '%s' "$LEGACY")" = "59362816"
          echo "4e28c1a2e982294ede1dc0f04c36611dd6eea5a2bfecfb7a653cb4597bc03034  $LEGACY" |
            sha256sum --check -

      - name: Download and verify the existing ReleaseOnly package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p existing
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ONLY" --dir existing
          test "$(stat -c '%s' "existing/$RELEASE_ONLY")" = "18670592"
          echo "dae566c0f9618558d3bcc1bb600eaf1a93d9bd2a1c179cc0b74df6fb4ef309f4  existing/$RELEASE_ONLY" |
            sha256sum --check -

      - name: Write verified metadata
        shell: bash
        run: |
          cat > SHA256SUMS.txt <<'SUMS'
          4e28c1a2e982294ede1dc0f04c36611dd6eea5a2bfecfb7a653cb4597bc03034  CleanFlash_34.0.0.376_LegacyBundle_56.6MiB.exe
          dae566c0f9618558d3bcc1bb600eaf1a93d9bd2a1c179cc0b74df6fb4ef309f4  CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe
          SUMS
          cat > RELEASE_NOTES.md <<'NOTES'
          # CleanFlash 34.0.0.376 — 两个安装包
          
          本 Release 同时提供两个内容不同的安装包：
          
          ## LegacyBundle（56.6 MiB）
          
          - 文件：`CleanFlash_34.0.0.376_LegacyBundle_56.6MiB.exe`
          - 大小：59,362,816 字节
          - SHA-256：`4e28c1a2e982294ede1dc0f04c36611dd6eea5a2bfecfb7a653cb4597bc03034`
          - 同时包含 Release 与 Debug 组件。
          - 在 Windows 10 专业版 22H2 x64（19045.5912）上实际运行约 4 小时，未观察到异常；当时系统注册的是 Release OCX。
          
          ## ReleaseOnly（17.8 MiB）
          
          - 文件：`CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe`
          - 大小：18,670,592 字节
          - SHA-256：`dae566c0f9618558d3bcc1bb600eaf1a93d9bd2a1c179cc0b74df6fb4ef309f4`
          - 从当前源码重新构建，只包含 Release 组件。
          - 核心 Release Flash 文件与 LegacyBundle 内对应文件逐字节一致。
          - 尚未完成最终用户环境的端到端运行测试。
          
          此前错误目前无法复现，诊断时也没有观察到目标程序加载 Flash 模块。因此本 Release 不声称已经证明原错误由 Flash 引起，也不保证任一安装包能够修复所有电脑。
          
          来源与许可证：
          
          - 原 GitHub 项目：<https://github.com/TCOTC/CleanFlash_Installer>
          - 原 GitLab 项目：<https://gitlab.com/cleanflash/installer>
          - MIT 许可证与原作者署名保留。
          NOTES

      - name: Upload and update the Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$LEGACY" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "CleanFlash 34.0.0.376 — 两个安装包" \
            --notes-file RELEASE_NOTES.md --prerelease

      - name: Verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$LEGACY" --dir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ONLY" --dir published
          cp SHA256SUMS.txt published/
          cd published
          sha256sum --check SHA256SUMS.txt

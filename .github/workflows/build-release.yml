name: Build ReleaseOnly installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the public GitHub Release
        required: true
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-release.yml"
      - "scripts/**"
      - "release-notes/**"
      - "CleanFlashCommon/**"
      - "CleanFlashInstaller/**"
      - "CleanFlashUninstaller/**"

permissions:
  contents: write

concurrency:
  group: cleanflash-34.0.0.376-release-only
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK for MSBuild SDK resolution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and verify installer
        shell: powershell
        run: |
          .\scripts\Build-ReleaseOnly.ps1

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanFlash-34.0.0.376-ReleaseOnly
          path: |
            dist/CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v34.0.0.376-release-only.1
        run: |
          $notes = "release-notes/v34.0.0.376-release-only.1.md"
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title "Clean Flash 34.0.0.376 ReleaseOnly" `
              --notes-file $notes
          }
          gh release upload $env:RELEASE_TAG `
            "dist/CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe" `
            "dist/SHA256SUMS.txt" `
            --clobber

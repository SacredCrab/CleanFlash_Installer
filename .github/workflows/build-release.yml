name: Build ReleaseOnly installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-release.yml"
      - "scripts/**"
      - "release-notes/**"
      - "CleanFlashCommon/**"
      - "CleanFlashInstaller/**"
      - "CleanFlashUninstaller/**"

permissions:
  contents: read

concurrency:
  group: cleanflash-34.0.0.376-release-only
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK for MSBuild SDK resolution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and verify installer
        shell: powershell
        run: |
          .\scripts\Build-ReleaseOnly.ps1

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanFlash-34.0.0.376-ReleaseOnly
          path: |
            dist/CleanFlash_34.0.0.376_ReleaseOnly_Installer.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
